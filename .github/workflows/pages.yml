name: Publish NIKO ARCADE v18 (fixed games)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'tools/fix_site_v17.py'
      - 'tools/upgrade_v18.py'
      - 'tools/site-v18-overlay.zip'
      - 'tools/verify_site_v18.py'
      - 'tools/sw_offline_smoke_v17.js'
      - 'tools/test_retro_catalog_v18.js'
      - 'tools/browser_smoke_v18.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: niko-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack previously uploaded v15 game (do not re-upload large ROMs)
        shell: bash
        run: |
          set -euo pipefail
          cat v15-final-*.bin > /tmp/niko-v15.zip
          echo '640c147d0f1295dfe9e9b8ef893be903086348e80d26eba6b753d3f8fa0d6680  /tmp/niko-v15.zip' | sha256sum -c -
          unzip -tq /tmp/niko-v15.zip
          mkdir -p /tmp/niko-site
          unzip -q /tmp/niko-v15.zip -d /tmp/niko-site
          if [ -f /tmp/niko-site/public/club.html ]; then
            echo '/tmp/niko-site/public' > /tmp/niko-site-path
          else
            echo '/tmp/niko-site' > /tmp/niko-site-path
          fi
      - name: Apply game + offline + retro + music-removal fixes
        shell: bash
        run: |
          set -euo pipefail
          SITE="$(cat /tmp/niko-site-path)"
          unzip -oq tools/site-v18-overlay.zip -d "$SITE"
          rm -rf "$SITE/music-studio" "$SITE/intro" "$SITE/tabletop"
      - name: Verify every page, file and cartridge
        shell: bash
        run: |
          set -euo pipefail
          SITE="$(cat /tmp/niko-site-path)"
          python3 tools/verify_site_v18.py "$SITE"
          node tools/sw_offline_smoke_v17.js "$SITE"
          node tools/test_retro_catalog_v18.js "$SITE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chrome browser tests
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Verify every screen in a mobile browser
        shell: bash
        run: |
          set -euo pipefail
          SITE="$(cat /tmp/niko-site-path)"
          mkdir -p /tmp/niko-http
          ln -s "$SITE" /tmp/niko-http/Niko-games
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/niko-http >/tmp/niko-http.log 2>&1 &
          sleep 2
          python3 tools/browser_smoke_v18.py
      - name: Export exact built site path
        id: buildpath
        shell: bash
        run: echo "site=$(cat /tmp/niko-site-path)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.buildpath.outputs.site }}
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
